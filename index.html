<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bridgeway Student Portal</title>
  <link rel="icon" href="logo.jpeg">
  <style>
    :root { --bg: #f6f5f1; --surface: #fff; --ink: #0b1f3f; --ink-2: #55617a; --line: #e5e3dc; --gold: #c8962f; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c1424; --surface: #131e33; --ink: #eef2f8; --ink-2: #a8b4c8; --line: #24314a; --gold: #e2b65a; color-scheme: dark; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 16px/1.55 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    main { width: 100%; max-width: 440px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 40px 28px; box-shadow: 0 1px 2px rgba(16,32,40,.05), 0 10px 32px rgba(16,32,40,.07); }
    .logo { width: 88px; height: 88px; object-fit: contain; border-radius: 16px; background: #fff; padding: 6px; }
    .eyebrow { margin: 18px 0 4px; color: var(--gold); font-weight: 600; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
    h1 { margin: 0 0 12px; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; }
    p { margin: 0; color: var(--ink-2); }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="logo.jpeg" alt="Bridgeway Tutors logo" width="88" height="88">
    <p class="eyebrow">Bridgeway Tutors</p>
    <h1>Student Portal</h1>
    <p>Your tutor will send you a personal link to your page. Open that link to see your work.</p>
  </main>
</body>
</html>
